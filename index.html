<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Antonio Troy Ferron — Art Direction, Set Design & Production Design</title>
  <link rel="stylesheet" href="https://use.typekit.net/npm0roe.css">
  <style>
:root {
  --paper: #240706;
  --ink: #f1e7d8;
  --gutter: 8px;
}

* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; background: var(--paper); }
body {
  color: var(--ink);
  font-family: 'Aktiv Grotesk', 'Proxima Nova', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 300;
  overflow: hidden;
}

/* V33 — one composition for every screen size:
   full-bleed vertical image wall + centered masthead. */
.splash {
  position: relative;
  width: 100vw;
  height: 100svh;
  min-height: 520px;
  overflow: hidden;
  background-color: var(--paper);
  background-image:
    linear-gradient(rgba(20,0,0,.05), rgba(20,0,0,.05)),
    url('assets/blueprint-grid.png');
  background-size: auto, 760px 760px;
  background-repeat: repeat;
}

.image-wall {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(var(--column-count, 3), minmax(0, 1fr));
  gap: var(--gutter);
  overflow: hidden;
}

.filmstrip {
  position: relative;
  min-width: 0;
  height: 100svh;
  overflow: hidden;
}

.track {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: max-content;
  gap: var(--gutter);
  will-change: transform;
}

.image-cell {
  position: relative;
  display: block;
  width: 100%;
  flex: 0 0 auto;
  overflow: hidden;
  background: var(--paper);
}

.image-cell img {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  transform: scale(1);
  transform-origin: center center;
  filter: saturate(.88) contrast(1.03);
  transition:
    transform .42s cubic-bezier(.2,.72,.25,1),
    filter .34s ease;
}

/* Continuous opposing vertical motion. */
.filmstrip:nth-child(1) .track {
  animation: driftUp 108s linear infinite;
}
.filmstrip:nth-child(2) .track {
  animation: driftDown 118s linear infinite;
  transform: translateY(-50%);
}
.filmstrip:nth-child(3) .track {
  animation: driftUp 126s linear infinite;
}

@keyframes driftUp {
  from { transform: translateY(0); }
  to   { transform: translateY(-50%); }
}
@keyframes driftDown {
  from { transform: translateY(-50%); }
  to   { transform: translateY(0); }
}

/* The buttons alone drive category preview. No outlines, borders, or image links. */
.splash.preview-theater .image-cell[data-category~="theater"] img,
.splash.preview-film .image-cell[data-category~="film"] img,
.splash.preview-sketchbook .image-cell[data-category~="sketchbook"] img {
  transform: scale(1.065);
  filter: saturate(.94) contrast(1.055) brightness(1.035);
}

/* Masthead floats above the image wall. The fade fills the viewport itself,
   so there is no rectangular overlay edge to reveal. */
.identity {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: clamp(18px, 3vw, 52px);
  text-align: center;
  pointer-events: none;
}

.identity::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(
    ellipse 72% 48% at 50% 50%,
    rgba(36,7,6,.99) 0%,
    rgba(36,7,6,.975) 30%,
    rgba(36,7,6,.88) 47%,
    rgba(36,7,6,.60) 63%,
    rgba(36,7,6,.24) 78%,
    rgba(36,7,6,0) 96%
  );
}

.identity-inner {
  width: min(1000px, calc(100vw - 48px));
  display: grid;
  gap: clamp(14px, 2.2svh, 28px);
  align-items: center;
  pointer-events: auto;
}

.discipline {
  margin: 0;
  width: 100%;
  font-family: 'Aktiv Grotesk', 'Proxima Nova', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 300;
  font-size: clamp(9px, .9vw, 14px);
  line-height: 1;
  letter-spacing: .26em;
  white-space: nowrap;
  text-transform: uppercase;
  text-shadow: 0 1px 12px rgba(18,0,0,.65);
}
.discipline span { margin: 0 .62em; opacity: .6; }

h1 {
  position: relative;
  margin: 0;
  width: 100%;
  padding: 4px 0 3px;
  font-family: 'cormorant-garamond', serif;
  font-weight: 300;
  font-style: normal;
  font-synthesis: none;
  font-size: clamp(44px, 4.2vw, 68px);
  line-height: .95;
  letter-spacing: .002em;
  white-space: nowrap;
  text-shadow: 0 2px 16px rgba(18,0,0,.62);
}

h1::before,
h1::after {
  content: "";
  position: absolute;
  left: 0;
  width: 100%;
  height: 1px;
  opacity: .82;
  background: linear-gradient(90deg,
    rgba(245,236,216,.18) 0%,
    rgba(245,236,216,.72) 7%,
    rgba(239,226,198,.58) 28%,
    rgba(248,240,222,.84) 52%,
    rgba(239,226,198,.60) 76%,
    rgba(245,236,216,.18) 100%);
  box-shadow: 0 .45px 0 rgba(244,231,204,.14);
}
h1::before { top: 0; transform: rotate(-.035deg); }
h1::after  { bottom: 0; transform: rotate(.045deg); }

.portals {
  --portal-gap: clamp(10px, 1.05vw, 16px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--portal-gap);
  width: min(760px, 100%);
  justify-self: center;
}

.portals a {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 50px;
  padding: 0 18px;
  border: 0;
  background: transparent;
  color: var(--ink);
  text-decoration: none;
  isolation: isolate;
  overflow: visible;
  font-family: "adobe-jenson-pro", serif;
  font-weight: 300;
  font-style: normal;
  font-size: clamp(12px, .9vw, 14px);
  line-height: 1;
  letter-spacing: .11em;
  white-space: nowrap;
  transition: color .18s ease;
}

.portals .portal-sketchbook {
  grid-column: 1 / -1;
  width: calc((100% - var(--portal-gap)) / 2);
  justify-self: center;
}

.portal-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  z-index: -1;
}
.portal-fill {
  fill: rgba(241,231,216,0);
  stroke: none;
  transition: fill .20s ease;
}
.portal-outer {
  fill: none;
  stroke: rgba(241,231,216,.92);
  stroke-width: .55;
  vector-effect: non-scaling-stroke;
  transition: stroke .20s ease;
}
.portal-inner {
  fill: none;
  stroke: rgba(241,231,216,.66);
  stroke-width: 1.05;
  vector-effect: non-scaling-stroke;
  transition: stroke .20s ease;
}
.portals a span { position: relative; z-index: 1; }

.portals a:hover,
.portals a:focus-visible {
  color: var(--paper);
  outline: none;
}
.portals a:hover .portal-fill,
.portals a:focus-visible .portal-fill { fill: var(--ink); }
.portals a:hover .portal-outer,
.portals a:focus-visible .portal-outer { stroke: rgba(36,7,6,.88); }
.portals a:hover .portal-inner,
.portals a:focus-visible .portal-inner { stroke: rgba(36,7,6,.64); }

/* Two-column stage. Images remain full-width within their columns. */
@media (max-width: 1279px) {
  .splash { --column-count: 2; }
  .identity-inner { width: min(820px, calc(100vw - 40px)); }
  h1 { font-size: clamp(38px, 5vw, 58px); }
  .portals { width: min(650px, 100%); }
}

/* Narrow portrait keeps two vertical streams, with a wider masthead veil for legibility. */
@media (max-width: 699px) {
  :root { --gutter: 6px; }
  .splash {
    --column-count: 2;
    min-height: 500px;
  }
  .identity { padding: 14px; }
  .identity::before {
    background: radial-gradient(
      ellipse 118% 42% at 50% 50%,
      rgba(36,7,6,.995) 0%,
      rgba(36,7,6,.98) 34%,
      rgba(36,7,6,.88) 54%,
      rgba(36,7,6,.58) 72%,
      rgba(36,7,6,.22) 88%,
      rgba(36,7,6,0) 100%
    );
  }
  .identity-inner {
    width: min(94vw, 610px);
    gap: clamp(18px, 3.7svh, 32px);
  }
  h1 { font-size: clamp(22px, 7.4vw, 36px); }
  .discipline {
    font-size: clamp(7px, 2.15vw, 10px);
    letter-spacing: .13em;
  }
  .discipline span { margin-inline: .32em; }
  .portals {
    width: min(440px, 100%);
    gap: 8px;
  }
  .portals a {
    min-height: 46px;
    padding-inline: 9px;
    font-size: clamp(9px, 2.7vw, 11px);
    letter-spacing: .07em;
  }
}

@media (orientation: landscape) and (max-height: 620px) {
  .identity-inner { gap: 10px; }
  h1 { font-size: clamp(32px, 4vw, 52px); }
  .discipline { font-size: clamp(8px, .8vw, 11px); }
  .portals { width: min(650px, 100%); }
  .portals a { min-height: 40px; }
}

@media (prefers-reduced-motion: reduce) {
  .track { animation-play-state: paused !important; }
}


/* V35 deployment-safe wall geometry */
html, body { width:100%; height:100%; overflow:hidden; }
.splash { position:fixed; inset:0; width:100%; height:100svh; min-height:0; overflow:hidden; }
.image-wall { position:absolute !important; inset:0 !important; width:100% !important; height:100% !important; display:grid !important; grid-template-columns:repeat(var(--column-count, 3), minmax(0,1fr)) !important; gap:8px; overflow:hidden; z-index:1; }
.filmstrip { position:relative !important; inset:auto !important; width:100% !important; height:100svh !important; min-width:0; overflow:hidden !important; padding:0 !important; }
.track { position:relative !important; inset:auto !important; display:flex !important; flex-direction:column !important; width:100% !important; height:max-content !important; gap:8px; }
.track .image-cell { display:block !important; position:relative !important; width:100% !important; height:auto !important; flex:0 0 auto !important; overflow:hidden !important; margin:0 !important; }
.track .image-cell img { display:block !important; width:100% !important; height:auto !important; max-width:none !important; max-height:none !important; object-fit:cover; }
.filmstrip:nth-child(1) .track { animation: v35Up 108s linear infinite !important; }
.filmstrip:nth-child(2) .track { animation: v35Down 118s linear infinite !important; }
.filmstrip:nth-child(3) .track { animation: v35Up 126s linear infinite !important; }
@keyframes v35Up { from { transform:translate3d(0,0,0); } to { transform:translate3d(0,-50%,0); } }
@keyframes v35Down { from { transform:translate3d(0,-50%,0); } to { transform:translate3d(0,0,0); } }
.identity { position:absolute !important; inset:0 !important; z-index:10 !important; display:grid !important; place-items:center !important; overflow:visible !important; }
.identity::before { inset:-20vmax !important; background:radial-gradient(ellipse 62% 44% at 50% 50%, rgba(36,7,6,.99) 0%, rgba(36,7,6,.97) 28%, rgba(36,7,6,.86) 44%, rgba(36,7,6,.58) 59%, rgba(36,7,6,.24) 72%, rgba(36,7,6,.07) 82%, rgba(36,7,6,0) 92%) !important; }
.identity-inner { max-width:100%; }
@media (max-width:1279px) { .splash { --column-count:2; } .identity-inner { width:min(900px, calc(100vw - 28px)); } }
@media (min-width:1280px) { .splash { --column-count:3; } }
@media (max-width:720px) {
  .identity { padding:18px 12px !important; }
  .identity-inner { width:calc(100vw - 24px) !important; gap:14px; }
  .discipline { font-size:clamp(7px,2.2vw,10px); letter-spacing:.16em; }
  .discipline span { margin:0 .3em; }
  h1 { font-size:clamp(31px,9.2vw,48px); }
  .portals { width:min(560px,100%); gap:8px; }
  .portals a { min-height:46px; padding:0 8px; font-size:clamp(10px,2.8vw,13px); letter-spacing:.06em; }
}
@media (prefers-reduced-motion: reduce) {
  .filmstrip .track { animation-duration:240s !important; }
}

</style>
</head>
<body>
  <main class="splash">
    <div class="image-wall" id="imageWall" aria-hidden="true"></div>

    <section class="identity">
      <div class="identity-inner">
        <p class="discipline">ART DIRECTION <span>·</span> SET DESIGN <span>·</span> PRODUCTION DESIGN</p>
        <h1>ANTONIO TROY FERRON</h1>
        <nav class="portals" aria-label="Portfolio sections">
          <a href="https://antonioferron.myportfolio.com/theater" data-highlight="theater">
            <svg class="portal-frame" viewBox="0 0 320 80" preserveAspectRatio="none" aria-hidden="true">

              <path class="portal-fill" d="M48 10 H140 C150 10 156 5 160 1 C164 5 170 10 180 10 H272 C295 10 310 22 310 40 C310 58 295 70 272 70 H180 C170 70 164 75 160 79 C156 75 150 70 140 70 H48 C25 70 10 58 10 40 C10 22 25 10 48 10 Z"/>
              <path class="portal-outer" d="M48 10 H140 C150 10 156 5 160 1 C164 5 170 10 180 10 H272 C295 10 310 22 310 40 C310 58 295 70 272 70 H180 C170 70 164 75 160 79 C156 75 150 70 140 70 H48 C25 70 10 58 10 40 C10 22 25 10 48 10 Z"/>
              <path class="portal-inner" d="M50 15 H142 C151 15 157 11 160 8 C163 11 169 15 178 15 H270 C289 15 304 25 304 40 C304 55 289 65 270 65 H178 C169 65 163 69 160 72 C157 69 151 65 142 65 H50 C31 65 16 55 16 40 C16 25 31 15 50 15 Z"/>

              <path class="portal-inner" d="M50 15 H142 C151 15 157 11 160 8 C163 11 169 15 178 15 H270 C289 15 304 25 304 40 C304 55 289 65 270 65 H178 C169 65 163 69 160 72 C157 69 151 65 142 65 H50 C31 65 16 55 16 40 C16 25 31 15 50 15 Z"/>

  <script>
const images = [
  '3dmodel_001.webp',
  'still_belair_001.webp',
  'still_FF2_001.webp',
  'still_comet_001.webp',
  'still_archive81_001.webp',
  'still_dialm_asolo_001.webp',
  'still_pilgrims_001.webp',
  'still_chickenbiscuits_002.webp',
  '3dmodel_004.webp',
  'still_comet_003.webp',
  'still_primarytrust_002.webp',
  'still_dialm_asolo_002.webp',
  'set_FF2_001.webp',
  'still_FF2_003.webp',
  'still_tlthtm_001.webp',
  'still_dialm_PPT_001.webp',
  'still_FF2_006.webp',
  'still_comet_002.webp',
  '3dmodel_006.webp',
  'still_belair_002.webp',
  'still_FF2_002.webp',
  'still_dialm_PPT_002.webp',
  'still_archive81_002.webp',
  '3dmodel_002.webp',
  'still_tlthtm_002.webp',
  'still_discoinferno_002.webp',
  'process_mtv_001.webp',
  '3dmodel_007.webp',
  'still_comet_004.webp',
  'still_tlthtm_003.webp',
  'still_comet_005.webp'
];

const theaterTerms = ['chickenbiscuits', 'comet', 'dialm', 'pilgrims', 'primarytrust'];
const filmTerms = ['ff2', 'archive81', 'belair', 'discoinferno', 'tlthtm', 'mtv'];
const sketchbookTerms = ['3dmodel'];

function categoriesFor(name) {
  const lower = name.toLowerCase();
  const categories = [];
  if (theaterTerms.some(term => lower.includes(term))) categories.push('theater');
  if (filmTerms.some(term => lower.includes(term))) categories.push('film');
  if (sketchbookTerms.some(term => lower.includes(term))) categories.push('sketchbook');
  return categories.join(' ');
}

function primaryCategoryFor(name) {
  return categoriesFor(name).split(' ').filter(Boolean)[0] || 'other';
}

/* Preserve the V24 mixing rule: no more than two consecutive images from
   one category inside any visible vertical stream. */
function balanceCategories(list) {
  const buckets = new Map();
  list.forEach(name => {
    const category = primaryCategoryFor(name);
    if (!buckets.has(category)) buckets.set(category, []);
    buckets.get(category).push(name);
  });

  const result = [];
  let lastCategory = null;
  let runLength = 0;

  while ([...buckets.values()].some(bucket => bucket.length)) {
    const candidates = [...buckets.entries()]
      .filter(([, bucket]) => bucket.length)
      .filter(([category]) => !(category === lastCategory && runLength >= 2))
      .sort((a, b) => b[1].length - a[1].length);

    const fallback = [...buckets.entries()].find(([, bucket]) => bucket.length);
    const [category, bucket] = candidates[0] || fallback;
    result.push(bucket.shift());

    if (category === lastCategory) runLength += 1;
    else {
      lastCategory = category;
      runLength = 1;
    }
  }

  const cyclicallyValid = sequence => {
    const cats = sequence.map(primaryCategoryFor);
    for (let i = 0; i < cats.length; i++) {
      if (cats[i] === cats[(i + 1) % cats.length] && cats[i] === cats[(i + 2) % cats.length]) return false;
    }
    return true;
  };

  if (!cyclicallyValid(result)) {
    for (let offset = 1; offset < result.length; offset++) {
      const rotated = [...result.slice(offset), ...result.slice(0, offset)];
      if (cyclicallyValid(rotated)) return rotated;
    }
  }
  return result;
}

function desiredColumnCount() {
  return window.innerWidth >= 1280 ? 3 : 2;
}

function splitForColumns(count) {
  const ordered = balanceCategories(images);
  const columns = Array.from({ length: count }, () => []);
  ordered.forEach((name, index) => columns[index % count].push(name));
  return columns.map(balanceCategories);
}

function makeCell(name, index) {
  const cell = document.createElement('span');
  cell.className = 'image-cell';
  cell.dataset.filename = name;
  cell.dataset.category = categoriesFor(name);

  const img = document.createElement('img');
  img.src = `assets/splash_opt/${name}`;
  img.alt = '';
  img.dataset.filename = name;
  img.dataset.category = categoriesFor(name);
  img.loading = index < 3 ? 'eager' : 'lazy';
  img.fetchPriority = index < 2 ? 'high' : 'auto';
  img.decoding = 'async';

  cell.appendChild(img);
  return cell;
}

let renderedColumnCount = 0;
function renderImageWall(force = false) {
  const count = desiredColumnCount();
  if (!force && count === renderedColumnCount) return;
  renderedColumnCount = count;

  const wall = document.getElementById('imageWall');
  wall.innerHTML = '';
  document.querySelector('.splash').style.setProperty('--column-count', count);

  splitForColumns(count).forEach((list, columnIndex) => {
    const strip = document.createElement('div');
    strip.className = 'filmstrip';

    const track = document.createElement('div');
    track.className = 'track';
    track.id = `track${columnIndex + 1}`;

    [...list, ...list].forEach((name, index) => {
      track.appendChild(makeCell(name, index));
    });

    strip.appendChild(track);
    wall.appendChild(strip);
  });
}

renderImageWall(true);

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => renderImageWall(false), 140);
});

const splash = document.querySelector('.splash');

function startPreview(kind) {
  splash.classList.add('category-preview');
  splash.classList.toggle('preview-theater', kind === 'theater');
  splash.classList.toggle('preview-film', kind === 'film');
  splash.classList.toggle('preview-sketchbook', kind === 'sketchbook');
}

function stopPreview() {
  splash.classList.remove('category-preview', 'preview-theater', 'preview-film', 'preview-sketchbook');
}

/* Only the three word buttons trigger previews now. Images are passive. */
document.querySelectorAll('.portals a[data-highlight]').forEach(button => {
  button.addEventListener('mouseenter', () => startPreview(button.dataset.highlight));
  button.addEventListener('mouseleave', stopPreview);
  button.addEventListener('focus', () => startPreview(button.dataset.highlight));
  button.addEventListener('blur', stopPreview);
});

(async function ensureCormorantLight() {
  if (!document.fonts) return;
  try {
    await document.fonts.load('300 64px "cormorant-garamond"', 'ANTONIO TROY FERRON');
    await document.fonts.ready;
    document.documentElement.classList.add('fonts-ready');
  } catch (e) {
    console.warn('Cormorant Garamond Light did not resolve:', e);
  }
})();

  </script>
